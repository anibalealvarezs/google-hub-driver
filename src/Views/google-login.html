<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Login | APIs Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #0a0c10;
            --card-bg: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --text-dim: #8b949e;
            --primary: #58a6ff;
            --primary-hover: #1f6feb;
            --success: #238636;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 50px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            background: rgba(88, 166, 255, 0.1);
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
        }
        h1 {
            color: #fff;
            font-size: 1.8rem;
            margin-bottom: 15px;
            font-weight: 800;
        }
        p {
            color: var(--text-dim);
            line-height: 1.6;
            margin-bottom: 40px;
            font-size: 0.95rem;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: var(--primary);
            color: #fff;
            padding: 16px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            width: 100%;
            box-sizing: border-box;
        }
        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(31, 111, 235, 0.3);
        }
        .btn:active {
            transform: translateY(0);
        }
        .footer-note {
            margin-top: 30px;
            font-size: 0.75rem;
            color: var(--text-dim);
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="icon-circle">
            <i data-lucide="log-in" size="32"></i>
        </div>
        <h1>Google Connection</h1>
        <p>Authorize APIs Hub to access your Google Search Console and Google Analytics data. We only request read-only permissions.</p>
        
        <a href="/google-auth-start" class="btn">
            <i data-lucide="mail"></i>
            Continue with Google
        </a>

        <div class="footer-note">
            Secure OAuth2 flow powered by Google Identity.
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
